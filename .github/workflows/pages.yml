name: Pages

# Renders the site from the per-build manifests on `website`, builds it with Jekyll and
# deploys the artifact. Every run derives the whole tree, so one run heals whatever the
# previous one got wrong. Branch split, surface ownership and the analytics beacon are
# documented in rvb's docs/ci-pipelines.md and docs/decisions/0016.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Our own group, not "pages": the legacy pages-build-deployment workflow used
  # to hold that name and deadlock against this one. That workflow disappears
  # when the Pages source is Actions, but a private name costs nothing.
  group: archive-pages-render
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out the site branch
        uses: actions/checkout@v4
        with:
          ref: site
          path: site

      - name: Fetch the generator from rvb
        # Imported, not mirrored: the rendering rules have one implementation and it
        # lives with the pipeline that produces the data. rvb is public, so this needs
        # no credential.
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse \
            https://github.com/nullcpy/rvb .rvb
          git -C .rvb sparse-checkout set .github/scripts
          if [ ! -f .rvb/.github/scripts/build_archive_pages.py ]; then
            echo "::error::build_archive_pages.py is missing from rvb's main:" \
                 "the change is not pushed there yet, or it was renamed" >&2
            exit 1
          fi

      - name: Export this build set's manifests
        run: |
          git fetch --quiet --depth 1 origin website
          rm -rf _data && mkdir -p _data
          git archive FETCH_HEAD manifests | tar -x -C _data
          echo "manifests: $(find _data/manifests -name '*.json' | wc -l)"

      - name: Export the release download counters
        # Feeds the index's Downloads column; the generator stays offline and
        # deterministic. If this fetch fails the next step simply omits --counts, so the
        # render loses the column and nothing else.
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          headers = {"Accept": "application/vnd.github+json",
                     "User-Agent": "archive-pages"}
          token = os.environ.get("GITHUB_TOKEN", "")
          if token:
              headers["Authorization"] = "Bearer " + token
          url = ("https://api.github.com/repos/%s/releases?per_page=100"
                 % os.environ["GITHUB_REPOSITORY"])
          counts, page = {}, 1
          while True:
              try:
                  got = json.loads(urllib.request.urlopen(
                      urllib.request.Request("%s&page=%d" % (url, page),
                                             headers=headers),
                      timeout=120).read().decode())
              except Exception as exc:
                  print("::warning::release counters unavailable (%s);"
                        " rendering without the Downloads column" % exc)
                  sys.exit(0)
              if not got:
                  break
              for rel in got:
                  files = {a["name"]: a["download_count"]
                           for a in rel.get("assets") or []}
                  if files:
                      counts[str(rel["tag_name"])] = files
              page += 1
          with open("_data/counts.json", "w", encoding="utf-8") as fh:
              json.dump(counts, fh, sort_keys=True)
          print("counters for %d releases, %d assets"
                % (len(counts), sum(len(v) for v in counts.values())))
          PY

      - name: Render the pages
        env:
          ARCHIVE_SITE_BASE: https://github.com/${{ github.repository }}/blob/main
          # Two surfaces are written: README.md for github.com browsing and
          # index.md for the Pages build, which links at that URL.
          ARCHIVE_PAGES_BASE: https://nullcpy.github.io/archive/
          NULLSTORE_URL: https://nullcpy.github.io/nullstore
        run: |
          rm -rf _gen
          counts=()
          if [ -s _data/counts.json ]; then counts=(--counts _data/counts.json); fi
          python3 .rvb/.github/scripts/build_archive_pages.py \
            --manifests _data/manifests --out _gen --cap 50 "${counts[@]}"
          python3 - <<'PY'
          import pathlib
          import re

          navigation = re.compile(r'^\[(?:older builds|newer builds)\]\([^\n]+\)$', re.MULTILINE)
          for path in pathlib.Path("_gen/apps").rglob("*.md"):
              text = path.read_text(encoding="utf-8")
              links = navigation.findall(text)
              if not links:
                  continue
              body = navigation.sub("", text).rstrip()
              path.write_text(body + "\n\n" + " | ".join(links) + "\n", encoding="utf-8")
          PY
          # Pages serves index.md at /; without it the site builds and then 404s,
          # which is exactly how it failed once.
          test -f _gen/index.md || { echo "::error::generator wrote no root index.md" >&2; exit 1; }

      - name: Commit the README surface to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf _data .rvb
          cp _gen/README.md README.md
          # README.md and the numbered continuation pages are the github.com
          # surface; index.md and page-*.md belong to the site branch.
          rsync -a --include='*/' --include='README.md' --include='[0-9]*.md' \
            --exclude='*' _gen/apps/ apps/
          git add README.md apps
          if git diff --cached --quiet; then
            echo "README surface unchanged."
            exit 0
          fi
          git commit -q -m "chore: rebuild the archive README surface [skip ci]"
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then
              echo "published the README surface"
              exit 0
            fi
            echo "push attempt $i failed, rebasing" >&2
            sleep 5
            git pull --rebase -q origin main || git rebase --abort || true
          done
          echo "::error::could not push the README surface after 3 attempts" >&2
          exit 1

      - name: Sync the Pages surface to the site branch
        run: |
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebuild the branch from the fresh render; the chrome is copied from
          # main so a layout or stylesheet edit reaches the deploy without a
          # second commit there.
          rm -rf site/index.md site/apps site/_layouts site/assets \
                 site/_config.yml site/favicon.svg
          mkdir -p site/apps
          cp _gen/index.md site/index.md
          rsync -a --include='*/' --include='index.md' --include='page-*.md' \
            --exclude='*' _gen/apps/ site/apps/
          cp _config.yml site/_config.yml
          cp -r _layouts site/_layouts
          cp -r assets site/assets
          cp favicon.svg site/favicon.svg
          git -C site add -A
          if git -C site diff --cached --quiet; then
            echo "Pages surface unchanged."
            exit 0
          fi
          git -C site commit -q -m "chore: rebuild the archive Pages surface [skip ci]"
          git -C site push -q origin HEAD:site

      - name: Inject the analytics beacon
        # Runs after the site commit on purpose: the working tree gets the real
        # tag, the repository keeps only the placeholder.
        env:
          CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          path = pathlib.Path("site/_layouts/default.html")
          html = path.read_text(encoding="utf-8")
          placeholder = "<!-- ANALYTICS-BEACON -->"
          if placeholder not in html:
              sys.exit("::error::the site layout lost its analytics placeholder")

          token = os.environ.get("CF_BEACON_TOKEN", "").strip()
          if not token:
              print("::warning::CF_BEACON_TOKEN is unset; deploying without analytics")
              tag = ""
          else:
              data = json.dumps({"token": token})
              tag = ('<script type="module" '
                     'src="https://static.cloudflareinsights.com/beacon.min.js"\n'
                     f"            data-cf-beacon='{data}'></script>")
          path.write_text(html.replace(placeholder, tag), encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
