name: Pages

# Renders the browsable site from the per-build manifests on `website`, then
# builds it with Jekyll and deploys the artifact. Triggered by rvb after each
# manifest publish, by a push that touches the layout or stylesheet, and on a
# schedule so a lost dispatch converges instead of leaving the view stale:
# everything is derived from scratch, so one run heals whatever the previous one
# got wrong.
#
# The deploy is what keeps the analytics token out of git: the layout carries a
# placeholder and this job replaces it from the CF_BEACON_TOKEN secret in the
# working tree only, after the content commit. A push made with GITHUB_TOKEN does
# not trigger this workflow, so the render commit cannot loop back into it.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Our own group, not "pages": the legacy pages-build-deployment workflow used
  # to hold that name and deadlock against this one. That workflow disappears
  # when the Pages source is Actions, but a private name costs nothing.
  group: archive-pages-render
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch the generator from rvb
        # Imported, not mirrored: the rendering rules have one implementation and it
        # lives with the pipeline that produces the data. rvb is public, so this needs
        # no credential.
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse \
            https://github.com/nullcpy/rvb .rvb
          git -C .rvb sparse-checkout set .github/scripts
          if [ ! -f .rvb/.github/scripts/build_archive_pages.py ]; then
            echo "::error::build_archive_pages.py is missing from rvb's main:" \
                 "the change is not pushed there yet, or it was renamed" >&2
            exit 1
          fi

      - name: Export this build set's manifests
        run: |
          git fetch --quiet --depth 1 origin website
          rm -rf _data && mkdir -p _data
          git archive FETCH_HEAD manifests | tar -x -C _data
          echo "manifests: $(find _data/manifests -name '*.json' | wc -l)"

      - name: Render the pages
        env:
          ARCHIVE_SITE_BASE: https://github.com/${{ github.repository }}/blob/main
          # Two surfaces are written: README.md for github.com browsing and
          # index.md for this Pages build, which links at that URL.
          ARCHIVE_PAGES_BASE: https://nullcpy.github.io/archive/
          NULLSTORE_URL: https://fahim-ahmed05.github.io/nullstore
        run: |
          python3 .rvb/.github/scripts/build_archive_pages.py \
            --manifests _data/manifests --out . --cap 50
          # Pages serves this at /; without it the site builds and then 404s,
          # which is exactly how it failed once.
          test -f index.md || { echo "::error::generator wrote no root index.md" >&2; exit 1; }

      - name: Commit and push only if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf _data .rvb
          # index.md is the Pages entry point and used to be left untracked,
          # so every rebuild produced a site with no root page.
          git add README.md index.md apps
          if git diff --cached --quiet; then
            echo "Pages unchanged; nothing to commit."
            exit 0
          fi
          git commit -q -m "chore: rebuild archive pages [skip ci]"
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then
              echo "published rebuilt pages"
              exit 0
            fi
            echo "push attempt $i failed, rebasing" >&2
            sleep 5
            git pull --rebase -q origin main || git rebase --abort || true
          done
          echo "::error::could not push the rebuilt pages after 3 attempts" >&2
          exit 1

      - name: Inject the analytics beacon
        # Runs after the commit on purpose: the working tree gets the real tag,
        # the repository keeps only the placeholder.
        env:
          CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          path = pathlib.Path("_layouts/default.html")
          html = path.read_text(encoding="utf-8")
          placeholder = "<!-- ANALYTICS-BEACON -->"
          if placeholder not in html:
              sys.exit("::error::the layout lost its analytics placeholder")

          token = os.environ.get("CF_BEACON_TOKEN", "").strip()
          if not token:
              print("::warning::CF_BEACON_TOKEN is unset; deploying without analytics")
              tag = ""
          else:
              data = json.dumps({"token": token})
              tag = ('<script type="module" '
                     'src="https://static.cloudflareinsights.com/beacon.min.js"\n'
                     f"            data-cf-beacon='{data}'></script>")
          path.write_text(html.replace(placeholder, tag), encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
